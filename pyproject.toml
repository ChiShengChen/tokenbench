[project]
name = "tokenbench"
version = "0.1.0"
description = "Local, reproducible baselines for Python LLM applications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "typer>=0.16,<1",
]

[project.optional-dependencies]
search = ["optuna>=4.6,<5"]

[project.scripts]
tokenbench = "tokenbench.cli:app"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.15,<3",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "types-pyyaml>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["optuna.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
