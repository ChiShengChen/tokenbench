name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.15']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          python-version: ${{ matrix.python-version }}
      - name: Install the locked dependencies and package
        run: uv sync --locked --extra search --no-editable
      - name: Check lint, formatting, and types
        run: |
          uv run --offline --no-sync ruff check .
          uv run --offline --no-sync ruff format --check .
          uv run --offline --no-sync mypy src tests scripts
      - name: Run tests
        run: uv run --offline --no-sync pytest
      - name: Run the offline CLI smoke test
        run: uv run --offline --no-sync python scripts/ci_smoke.py
